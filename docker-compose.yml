services:
  ripper-ui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: ripper-ui
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - SYSTEM_DIR=${SYSTEM_DIR:-/DATA/ripper_system}
      - MEDIA_DIR=${MEDIA_DIR:-/DATA/ripper_media}
      - UI_PORT=${UI_PORT:-8090}
      - MAKEMKV_PORT=${MAKEMKV_PORT:-5800}
      - HANDBRAKE_PORT=${HANDBRAKE_PORT:-5801}
      - FILEBROWSER_PORT=${FILEBROWSER_PORT:-8091}
    volumes:
      - ${SYSTEM_DIR:-/DATA/ripper_system}:/DATA/ripper_system
      - ${MEDIA_DIR:-/DATA/ripper_media}:/DATA/ripper_media
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: ripper-filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8091}:80"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FB_NOAUTH=true
    command: "--noauth"
    volumes:
      - ${MEDIA_DIR:-/DATA/ripper_media}:/srv
      - ${SYSTEM_DIR:-/DATA/ripper_system}/filebrowser:/database
