# ============================================================================
# Blinky's Auto DVD Ripper v2.0 - Multi-Container Docker Stack
# Services: MakeMKV (:5800), HandBrake (:5801), FileBrowser (:8091), Web UI (:8090)
# ============================================================================
services:
  ripper-ui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: ripper-ui
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - SYSTEM_DIR=${SYSTEM_DIR:-${DATA_DIR:-/DATA}/ripper_system}
      - MEDIA_DIR=${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}
      - UI_PORT=${UI_PORT:-8090}
      - MAKEMKV_PORT=${MAKEMKV_PORT:-5800}
      - HANDBRAKE_PORT=${HANDBRAKE_PORT:-5801}
      - FILEBROWSER_PORT=${FILEBROWSER_PORT:-8091}
    volumes:
      - ${SYSTEM_DIR:-${DATA_DIR:-/DATA}/ripper_system}:${DATA_DIR:-/DATA}/ripper_system
      - ${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}:${DATA_DIR:-/DATA}/ripper_media
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: ripper-filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8091}:80"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FB_NOAUTH=true
    command: "--noauth"
    volumes:
      - ${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}:/srv
      - ${SYSTEM_DIR:-${DATA_DIR:-/DATA}/ripper_system}/filebrowser:/database

  makemkv:
    image: jlesage/makemkv:latest
    container_name: makemkv
    restart: unless-stopped
    privileged: true
    device_cgroup_rules:
      - 'b 11:* rmw'
      - 'c 21:* rmw'
    ports:
      - "${MAKEMKV_PORT:-5800}:5800"
    environment:
      - USER_ID=${PUID:-1000}
      - GROUP_ID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
      - AUTO_DISC_RIPPER=1
      - AUTO_DISC_RIPPER_EJECT=1
      # Skip short trailers/menus under 10 mins (600s); keep featurettes & movies
      - AUTO_DISC_RIPPER_MIN_TITLE_LENGTH=600
    volumes:
      - ${SYSTEM_DIR:-${DATA_DIR:-/DATA}/ripper_system}/makemkv:/config
      - ${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}/raw:/output
      - ${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}:/storage
      - /dev:/dev

  handbrake:
    image: jlesage/handbrake:latest
    container_name: handbrake
    restart: unless-stopped
    ports:
      - "${HANDBRAKE_PORT:-5801}:5800"
    environment:
      - USER_ID=${PUID:-1000}
      - GROUP_ID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
      # Wait 30s of file inactivity so HandBrake never grabs an active MakeMKV rip
      - AUTOMATED_CONVERSION_SOURCE_STABLE_TIME=30
      - AUTOMATED_CONVERSION_PRESET=General/HQ 1080p30 Surround
      - AUTOMATED_CONVERSION_FORMAT=mp4
      # Keep raw MKVs until organize-rips.py verifies & moves the encoded MP4
      - AUTOMATED_CONVERSION_KEEP_SOURCE=1
      - AUTOMATED_CONVERSION_OUTPUT_DIR=/output
    volumes:
      - ${SYSTEM_DIR:-${DATA_DIR:-/DATA}/ripper_system}/handbrake:/config
      - ${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}/raw:/watch
      - ${MEDIA_DIR:-${DATA_DIR:-/DATA}/ripper_media}/finished:/output
